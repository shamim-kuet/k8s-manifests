apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eks-bmp-efranchise-python-hpa
  namespace: prod 
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eks-bmp-efranchise-python-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80