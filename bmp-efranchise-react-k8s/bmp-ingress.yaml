    # - host:  www.api.britishmarketplace.co.uk
    #   http:
    #     paths:      
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: eks-bmp-new-api-nodeport-service
    #             port: 
    #               number: 80 
    - host: britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-new-next-nodeport-service
                port: 
                  number: 80
    - host:  www.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-new-next-nodeport-service
