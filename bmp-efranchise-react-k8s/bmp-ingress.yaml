# Annotations Reference:  https://kubernetes-sigs.github.io/aws-alb-ingress-controller/guide/ingress/annotation/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-bmp-ingress-service
  namespace: dev
  labels:
    app: eks-bmp-food-python
  annotations:
    # Load Balancer Name
    alb.ingress.kubernetes.io/load-balancer-name: eks-bmp-ingress
    # Ingress Core Settings  
    #kubernetes.io/ingress.class: "alb" (OLD INGRESS CLASS NOTATION - STILL WORKS BUT RECOMMENDED TO USE IngressClass Resource)
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Health Check Settings
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP 
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    #Important Note:  Need to add health check path annotations in service level if we are planning to use multiple targets in a load balancer    
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'  
    ## SSL Settings
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn: | 
      arn:aws:acm:eu-west-2:298398654240:certificate/7661fdaa-295d-4134-9953-dd69db03a05b,
      arn:aws:acm:eu-west-2:298398654240:certificate/2742ae84-cba1-4fe1-8d5a-3d171c282a6f,
      arn:aws:acm:eu-west-2:298398654240:certificate/b77c03ab-7e4f-40e9-9209-7d39710a7cd6,
      arn:aws:acm:eu-west-2:298398654240:certificate/83d709a7-ec79-4e88-b7ed-055c74bb4c50,
      arn:aws:acm:eu-west-2:298398654240:certificate/5562b83f-f974-48e3-96cf-dece0b0dc524,
      arn:aws:acm:eu-west-2:298398654240:certificate/b0994b6a-0086-4853-b7f0-103f2d8db7e9,
      arn:aws:acm:eu-west-2:298398654240:certificate/dc520fe3-1e1a-486c-8fd8-8db74d45456c,
      arn:aws:acm:eu-west-2:298398654240:certificate/1af50867-59a7-470c-b230-4156c9018424
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm::298398654240:certificate/1af50867-59a7-470c-b230-4156c9018424
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06 #Optional (Picks default if not used) 
    alb.ingress.kubernetes.io/add-response-headers: |
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
      Referrer-Policy: "same-origin"   
    # SSL Redirect Setting
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # External DNS - For creating a Record Set in Route53
    # external-dns.alpha.kubernetes.io/hostname: admin.food.britishmarketplace.co.uk, www.admin.food.britishmarketplace.co.uk
    external-dns.alpha.kubernetes.io/hostname: britishmarketplace.co.uk, www.britishmarketplace.co.uk, api.britishmarketplace.co.uk, business.britishmarketplace.co.uk, www.business.britishmarketplace.co.uk, admin.business.britishmarketplace.co.uk, www.admin.business.britishmarketplace.co.uk, admin.food.britishmarketplace.co.uk, www.admin.food.britishmarketplace.co.uk, food.britishmarketplace.co.uk, www.food.britishmarketplace.co.uk
spec:
  ingressClassName: eks-bmp-ingress-class   # Ingress Class
  rules:
    - host: admin.food.britishmarketplace.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-food-python-nodeport-service
                port:
                  number: 80
    - host: www.admin.food.britishmarketplace.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-food-python-nodeport-service
                port:
                  number: 80
    - host: food.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-food-react-nodeport-service
                port: 
                  number: 80
    - host: www.food.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-food-react-nodeport-service
                port: 
                  number: 80
    - host: admin.business.britishmarketplace.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-efranchise-python-nodeport-service
                port:
                  number: 80
    - host: www.admin.business.britishmarketplace.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-efranchise-python-nodeport-service
                port:
                  number: 80
    - host: business.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-efranchise-react-nodeport-service
                port: 
                  number: 80
    - host: www.business.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-efranchise-react-nodeport-service
                port: 
                  number: 80
    - host:  api.britishmarketplace.co.uk
      http:
        paths:      
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eks-bmp-new-api-nodeport-service
                port: 
